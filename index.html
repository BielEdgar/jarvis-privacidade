<h1>Jarvis</h1>
<p>Jarvis é um assistente pessoal de uso privado, que roda no computador do próprio dono. Ele lê a agenda e os e-mails do dono para avisá-lo de compromissos e mensagens importantes.</p>
<p>Não é um serviço público: só o dono usa.</p>
